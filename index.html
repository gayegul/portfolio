<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Gaye Bulut — Senior Software Engineer</title>
    <meta name="title" content="Gaye Bulut — Senior Software Engineer" />
    <meta name="description" content="Founding engineer on Xbox Cloud Gaming. Now at Seesaw, building for 25M+ students." />
    <meta name="keywords" content="Gaye Bulut, Software Engineer, Xbox Cloud Gaming, Microsoft, Seesaw, React, TypeScript, Full Stack Developer" />
    <meta name="author" content="Gaye Bulut" />

    <!-- Fonts: self-hosted, served from /public/fonts. No external CSS
         round-trip; the Hero LCP font is preloaded so it arrives in
         parallel with the JS bundle instead of after first paint. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/newsreader.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/jetbrains-mono.woff2"
      crossorigin
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://gayebulut.com/" />
    <meta property="og:title" content="Gaye Bulut - Senior Software Engineer" />
    <meta property="og:description" content="Founding engineer on Xbox Cloud Gaming. Building for 25M+ students at Seesaw." />
    <meta property="og:image" content="https://gayebulut.com/og-image.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://gayebulut.com/" />
    <meta property="twitter:title" content="Gaye Bulut - Senior Software Engineer" />
    <meta property="twitter:description" content="Founding engineer on Xbox Cloud Gaming. Building for 25M+ students at Seesaw." />
    <meta property="twitter:image" content="https://gayebulut.com/og-image.jpg" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#F5F1E8" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
